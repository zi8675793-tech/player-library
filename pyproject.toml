[project]
name = "basketball-player-library"
version = "0.1.0"
description = "Match-scoped player library initialization, updates, and event retrieval"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.24,<2",
  "pillow>=10,<12",
  "pydantic>=2,<3",
  "uvicorn>=0.27,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = ["sample_data: read-only adapter checks when companion sample input is available"]
